<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكاة تخطيط القلب الكهربائي — ECG Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

  :root{
    --bezel-1:#151a17;
    --bezel-2:#0c0f0d;
    --screen:#04120a;
    --screen-edge:#020a06;
    --grid-major: rgba(57,255,20,0.16);
    --grid-minor: rgba(57,255,20,0.07);
    --trace:#39ff6a;
    --trace-glow: rgba(57,255,106,0.55);
    --amber:#ffb020;
    --red:#ff4d4d;
    --text-dim: rgba(190,255,210,0.55);
    --text: #d8ffe4;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #24291f 0%, #101410 45%, #08090a 100%);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    padding: 28px 16px;
  }

  .device{
    width:min(980px, 100%);
    background: linear-gradient(160deg, var(--bezel-1), var(--bezel-2) 70%);
    border-radius: 22px;
    padding: 22px 22px 18px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -2px 6px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.04);
  }

  .device-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 2px 8px 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--trace);
    box-shadow: 0 0 8px 2px var(--trace-glow);
    animation: pulse-dot 1s ease-in-out infinite;
  }
  @keyframes pulse-dot{
    0%,100%{opacity:1;} 50%{opacity:.35;}
  }
  .brand h1{
    font-family:'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 2.5px;
    font-weight: 700;
    margin:0;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .patient-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    direction: ltr;
  }

  /* screen */
  .screen-wrap{
    background: #010301;
    border-radius: 12px;
    padding: 4px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .screen{
    position:relative;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(57,255,106,0.05), transparent 60%),
      var(--screen);
    border-radius: 8px;
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.85), inset 0 0 2px var(--screen-edge);
  }
  .screen::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.12) 0px,
      rgba(0,0,0,0.12) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    mix-blend-mode: multiply;
    opacity:0.5;
  }

  canvas{
    display:block;
    width:100%;
    height: 260px;
  }

  .readouts{
    display:flex;
    justify-content: space-between;
    align-items:flex-end;
    padding: 10px 16px 14px;
    font-family:'JetBrains Mono', monospace;
    direction: ltr;
  }
  .readout-block{ text-align:left; }
  .readout-label{
    font-size:10px; letter-spacing:2px; color: var(--text-dim); text-transform:uppercase;
  }
  .readout-value{
    font-size: 34px; font-weight:800; line-height:1;
    color: var(--trace);
    text-shadow: 0 0 12px var(--trace-glow);
  }
  .readout-value.amber{ color: var(--amber); text-shadow: 0 0 12px rgba(255,176,32,0.55); }
  .readout-unit{ font-size:11px; color:var(--text-dim); margin-inline-start:4px; }
  .rhythm-tag{
    font-size: 11px;
    letter-spacing:1px;
    padding: 4px 10px;
    border-radius: 20px;
    border:1px solid currentColor;
  }
  .rhythm-tag.normal{ color: var(--trace); }
  .rhythm-tag.warn{ color: var(--amber); }
  .rhythm-tag.crit{ color: var(--red); animation: blink 1s step-start infinite; }
  @keyframes blink{ 50%{ opacity:0.3; } }

  /* controls */
  .controls{
    margin-top: 18px;
    background: rgba(0,0,0,0.25);
    border-radius: 14px;
    padding: 16px 18px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .control-row{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .control-row:last-child{ margin-bottom:0; }

  .control-group{ flex:1 1 220px; min-width: 220px; }
  .control-group label{
    display:flex; justify-content:space-between;
    font-size:12.5px; color: var(--text-dim); margin-bottom:6px;
  }
  .control-group label span.val{ color: var(--trace); font-family:'JetBrains Mono',monospace; direction:ltr; display:inline-block; }

  input[type="range"]{
    -webkit-appearance:none; width:100%; height:4px;
    border-radius:2px;
    background: linear-gradient(to right, var(--trace) 0%, var(--trace) var(--pct,50%), rgba(255,255,255,0.12) var(--pct,50%));
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px; border-radius:50%;
    background: var(--trace);
    box-shadow: 0 0 8px var(--trace-glow);
    cursor:pointer;
    border: 2px solid #04120a;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background: var(--trace); border: 2px solid #04120a; cursor:pointer;
  }

  .rhythm-select{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .rhythm-btn{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-dim);
    cursor:pointer;
    transition: all .15s ease;
  }
  .rhythm-btn:hover{ background: rgba(57,255,106,0.08); color: var(--text); }
  .rhythm-btn.active{
    background: rgba(57,255,106,0.12);
    border-color: var(--trace);
    color: var(--trace);
    box-shadow: 0 0 10px rgba(57,255,106,0.15);
  }

  .toggle-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px; letter-spacing:1px;
    padding: 10px 22px;
    border-radius: 8px;
    background: rgba(255,77,77,0.1);
    border: 1px solid var(--red);
    color: var(--red);
    cursor:pointer;
  }
  .toggle-btn.running{
    background: rgba(57,255,106,0.1);
    border-color: var(--trace);
    color: var(--trace);
  }

  .legend{
    display:flex; gap:18px; flex-wrap:wrap;
    font-size: 11.5px; color: var(--text-dim);
    padding: 12px 4px 0;
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend b{ color: var(--text); font-family:'JetBrains Mono',monospace; }

  @media (max-width: 560px){
    .readout-value{ font-size:26px; }
    canvas{ height: 200px; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="device-header">
    <div class="brand">
      <div class="dot"></div>
      <h1>محاكي تخطيط القلب — ECG SIM</h1>
    </div>
    <div class="patient-tag">LEAD II · SIM-MODE · 25mm/s</div>
  </div>

  <div class="screen-wrap">
    <div class="screen">
      <canvas id="ecgCanvas"></canvas>
    </div>
  </div>

  <div class="readouts">
    <div class="readout-block">
      <div class="readout-label">معدل النبض HR</div>
      <div class="readout-value" id="bpmValue">72<span class="readout-unit">bpm</span></div>
    </div>
    <div class="readout-block" style="text-align:center">
      <span class="rhythm-tag normal" id="rhythmTag">NSR — Normal Sinus Rhythm</span>
    </div>
    <div class="readout-block" style="text-align:end">
      <div class="readout-label">الفاصل RR</div>
      <div class="readout-value amber" id="rrValue">0.83<span class="readout-unit">s</span></div>
    </div>
  </div>

  <div class="legend">
    <span><b>P</b> — تقلص الأذينين (Atrial depolarization)</span>
    <span><b>QRS</b> — تقلص البطينين (Ventricular depolarization)</span>
    <span><b>T</b> — استرخاء البطينين (Ventricular repolarization)</span>
  </div>

  <div class="controls">
    <div class="control-row">
      <div class="control-group" style="flex:2 1 260px">
        <label>معدل النبض (Heart Rate) <span class="val" id="hrLabel">72 bpm</span></label>
        <input type="range" id="hrSlider" min="30" max="200" value="72" step="1">
      </div>
      <button class="toggle-btn running" id="toggleBtn">⏸ إيقاف</button>
    </div>
    <div class="control-row">
      <div class="control-group" style="flex:1 1 100%">
        <label style="margin-bottom:10px">نوع الإيقاع (Rhythm Type)</label>
        <div class="rhythm-select" id="rhythmSelect">
          <button class="rhythm-btn active" data-mode="normal">طبيعي (NSR)</button>
          <button class="rhythm-btn" data-mode="brady">بطء القلب (Bradycardia)</button>
          <button class="rhythm-btn" data-mode="tachy">تسرّع القلب (Tachycardia)</button>
          <button class="rhythm-btn" data-mode="afib">رجفان أذيني (AFib)</button>
          <button class="rhythm-btn" data-mode="pvc">انقباض بطيني مبكر (PVC)</button>
          <button class="rhythm-btn" data-mode="flatline">توقف القلب (Flatline)</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('ecgCanvas');
  const ctx = canvas.getContext('2d');
  const hrSlider = document.getElementById('hrSlider');
  const hrLabel = document.getElementById('hrLabel');
  const bpmValue = document.getElementById('bpmValue');
  const rrValue = document.getElementById('rrValue');
  const rhythmTag = document.getElementById('rhythmTag');
  const toggleBtn = document.getElementById('toggleBtn');
  const rhythmSelect = document.getElementById('rhythmSelect');

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W, H;
  function resize(){
    const rect = canvas.getBoundingClientRect();
    W = Math.floor(rect.width);
    H = Math.floor(rect.height);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buffer = new Array(W).fill(null);
    sweepX = 0;
  }

  let mode = 'normal';
  let baseBpm = 72;
  let running = true;
  let buffer = [];
  let sweepX = 0;
  let phase = 0; // ms position within current generated stream
  let pxPerMs;   // horizontal speed
  const mmPerSec = 25; // paper speed reference (visual only)

  // ---- ECG single-beat waveform generator ----
  // returns amplitude (roughly -0.2 to 1.2) for a given time t (ms) within one beat of length rr (ms)
  function gaussian(t, mu, sigma, amp){
    const d = (t - mu) / sigma;
    return amp * Math.exp(-0.5 * d * d);
  }

  function beatWaveform(t, rr, opts){
    opts = opts || {};
    // normalize beat timeline to a reference 800ms cycle, scaled to rr
    const scale = rr / 800;
    const tt = t / scale;

    let y = 0;
    // baseline wander (very subtle)
    y += Math.sin(t/900) * 0.01;

    // P wave
    if(!opts.noP) y += gaussian(tt, 160, 20, 0.10);

    // Q
    y += gaussian(tt, 268, 6, -0.10);
    // R
    y += gaussian(tt, 280, 9, (opts.rAmp!=null?opts.rAmp:1.05));
    // S
    y += gaussian(tt, 300, 8, -0.24);

    // T wave
    y += gaussian(tt, 430, 32, (opts.tAmp!=null?opts.tAmp:0.26));

    return y;
  }

  function flatlineWaveform(t){
    return Math.sin(t/700) * 0.008; // near-flat with tiny drift
  }

  // AFib: irregular RR + no clear P wave + fibrillatory baseline
  function nextRR(baseRR, mode){
    if(mode === 'afib'){
      const jitter = (Math.random() - 0.5) * baseRR * 0.55;
      return Math.max(280, baseRR + jitter);
    }
    if(mode === 'pvc'){
      return baseRR; // handled specially per-beat
    }
    return baseRR + (Math.random()-0.5) * baseRR * 0.02; // tiny natural variability
  }

  let currentRR = 833;
  let sampleT = 0; // ms elapsed within current beat
  let beatCount = 0;
  let pvcNext = false;
  let lastDisplayedRR = currentRR;

  function computeBaseRR(){
    let bpm = baseBpm;
    if(mode === 'brady') bpm = Math.min(bpm, 50);
    if(mode === 'tachy') bpm = Math.max(bpm, 130);
    if(mode === 'flatline') return 100000;
    return 60000 / bpm;
  }

  function stepSample(dtMs){
    if(mode === 'flatline'){
      return flatlineWaveform(phase);
    }

    sampleT += dtMs;
    if(sampleT >= currentRR){
      sampleT -= currentRR;
      beatCount++;
      currentRR = nextRR(computeBaseRR(), mode);
      lastDisplayedRR = currentRR;
      if(mode === 'pvc' && beatCount % 5 === 0){
        pvcNext = true;
      } else {
        pvcNext = false;
      }
    }

    if(mode === 'afib'){
      const fib = (Math.sin(phase*0.11) + Math.sin(phase*0.17) + Math.sin(phase*0.23)) * 0.015;
      return beatWaveform(sampleT, currentRR, {noP:true}) + fib;
    }

    if(pvcNext){
      // wide, tall, bizarre QRS with no preceding P, inverted T
      return beatWaveform(sampleT, currentRR * 0.9, {noP:true, rAmp:1.4, tAmp:-0.3});
    }

    return beatWaveform(sampleT, currentRR);
  }

  // ---- animation loop ----
  let lastFrame = null;
  const msPerPixel = 1000 / 80; // scroll speed reference (~80px/sec)

  function draw(){
    // background grid
    ctx.clearRect(0,0,W,H);

    const majorEvery = 40; // px
    const minorEvery = 8;

    ctx.lineWidth = 1;
    for(let x=0; x<W; x+=minorEvery){
      ctx.strokeStyle = (x % majorEvery === 0) ? 'rgba(57,255,20,0.16)' : 'rgba(57,255,20,0.055)';
      ctx.beginPath();
      ctx.moveTo(x+0.5,0);
      ctx.lineTo(x+0.5,H);
      ctx.stroke();
    }
    for(let y=0; y<H; y+=minorEvery){
      ctx.strokeStyle = (y % majorEvery === 0) ? 'rgba(57,255,20,0.16)' : 'rgba(57,255,20,0.055)';
      ctx.beginPath();
      ctx.moveTo(0,y+0.5);
      ctx.lineTo(W,y+0.5);
      ctx.stroke();
    }

    // trace
    const mid = H*0.58;
    const amp = H*0.34;

    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#39ff6a';
    ctx.shadowColor = 'rgba(57,255,106,0.65)';
    ctx.shadowBlur = 6;

    ctx.beginPath();
    let started = false;
    for(let x=0; x<W; x++){
      const v = buffer[x];
      if(v === null || v === undefined) continue;
      const y = mid - v*amp;
      if(!started){ ctx.moveTo(x,y); started = true; }
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // sweep erase gap indicator
    const gapW = 14;
    ctx.fillStyle = 'rgba(4,18,10,0.9)';
    ctx.fillRect(sweepX, 0, gapW, H);
  }

  function frame(ts){
    if(lastFrame === null) lastFrame = ts;
    let dt = ts - lastFrame;
    lastFrame = ts;
    if(dt > 100) dt = 100;

    if(running){
      const steps = Math.max(1, Math.round(dt));
      const pxAdvance = dt / msPerPixel;
      let pxAccum = (frame._acc || 0) + pxAdvance;
      frame._acc = pxAccum;

      while(pxAccum >= 1){
        const v = stepSample(msPerPixel);
        phase += msPerPixel;
        buffer[sweepX] = v;
        sweepX = (sweepX + 1) % W;
        pxAccum -= 1;
      }
      frame._acc = pxAccum;
    }

    draw();
    requestAnimationFrame(frame);
  }

  // ---- UI wiring ----
  function updateSliderFill(){
    const min = +hrSlider.min, max = +hrSlider.max, val = +hrSlider.value;
    const pct = ((val - min) / (max - min)) * 100;
    hrSlider.style.setProperty('--pct', pct + '%');
  }

  hrSlider.addEventListener('input', () => {
    baseBpm = +hrSlider.value;
    hrLabel.textContent = baseBpm + ' bpm';
    updateSliderFill();
  });
  updateSliderFill();

  toggleBtn.addEventListener('click', () => {
    running = !running;
    toggleBtn.textContent = running ? '⏸ إيقاف' : '▶ تشغيل';
    toggleBtn.classList.toggle('running', running);
    lastFrame = null;
  });

  const rhythmMeta = {
    normal:   {label:'NSR — Normal Sinus Rhythm', cls:'normal'},
    brady:    {label:'Sinus Bradycardia',         cls:'warn'},
    tachy:    {label:'Sinus Tachycardia',         cls:'warn'},
    afib:     {label:'Atrial Fibrillation',       cls:'crit'},
    pvc:      {label:'PVC — Ectopic Beats',       cls:'crit'},
    flatline: {label:'ASYSTOLE',                  cls:'crit'},
  };

  rhythmSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.rhythm-btn');
    if(!btn) return;
    [...rhythmSelect.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    const meta = rhythmMeta[mode];
    rhythmTag.textContent = meta.label;
    rhythmTag.className = 'rhythm-tag ' + meta.cls;
    sampleT = 0;
    currentRR = computeBaseRR();
    beatCount = 0;
  });

  function updateReadouts(){
    if(mode === 'flatline'){
      bpmValue.innerHTML = '0<span class="readout-unit">bpm</span>';
      rrValue.innerHTML = '—<span class="readout-unit">s</span>';
    } else {
      const displayBpm = Math.round(60000 / lastDisplayedRR);
      bpmValue.innerHTML = displayBpm + '<span class="readout-unit">bpm</span>';
      rrValue.innerHTML = (lastDisplayedRR/1000).toFixed(2) + '<span class="readout-unit">s</span>';
    }
    requestAnimationFrame(() => setTimeout(updateReadouts, 400));
  }

  window.addEventListener('resize', resize);
  resize();
  currentRR = computeBaseRR();
  requestAnimationFrame(frame);
  updateReadouts();
})();
</script>
</body>
</html>
